<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Video → Reels</title>
<style>
  /* ... (CSS sama seperti sebelumnya, tidak diubah) ... */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #eaeaea; min-height: 100vh; line-height: 1.5; }
  header { text-align: center; padding: 48px 20px 24px; border-bottom: 1px solid #1a1a1a; }
  h1 { font-size: 32px; margin-bottom: 8px; }
  .subtitle { color: #999; font-size: 16px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px; }
  .card { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  h2 { font-size: 18px; margin-bottom: 16px; color: #d4a574; }
  input[type="file"], input[type="number"] { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #eaeaea; font-size: 14px; margin-bottom: 12px; }
  input[type="number"] { width: 80px; }
  label { display: block; margin-bottom: 12px; color: #ccc; }
  button { background: #7c3aed; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  button:hover:not(:disabled) { background: #6d28d9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #333; }
  .hint { color: #888; font-size: 13px; margin-top: 8px; }
  .progress { height: 8px; background: #262626; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #7c3aed, #a78bfa); transition: width 0.3s; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
  .clip-card { background: #161616; border: 1px solid #262626; border-radius: 12px; overflow: hidden; }
  .clip-card video { width: 100%; display: block; background: black; aspect-ratio: 9/16; object-fit: contain; }
  .clip-info { padding: 16px; }
  .clip-info h3 { font-size: 16px; margin-bottom: 8px; }
  .clip-info p { color: #999; font-size: 13px; margin-bottom: 8px; }
  .clip-caption { background: #0a0a0a; padding: 10px; border-radius: 6px; font-size: 12px; color: #ccc; margin-bottom: 12px; }
  .clip-card button { width: 100%; font-size: 14px; padding: 10px; }
  .error-box { background: #7f1d1d; color: #fca5a5; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
  .success-box { background: #064e3b; color: #6ee7b7; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
  .step-indicator { display: flex; gap: 8px; margin-bottom: 16px; }
  .step { flex: 1; height: 4px; background: #262626; border-radius: 2px; transition: background 0.3s; }
  .step.active { background: #7c3aed; }
  .step.done { background: #10b981; }
</style>
</head>
<body>
<header>
  <h1>🎬 Video → Reels</h1>
  <p class="subtitle">Ubah video panjang menjadi klip vertikal 9:16 dengan AI · 100% di browser</p>
</header>

<main>
  <div id="errorBox" class="error-box"></div>
  <div id="successBox" class="success-box"></div>

  <section class="card">
    <h2>Upload Video</h2>
    <input type="file" id="videoInput" accept="video/*">
    <label>Jumlah klip: <input type="number" id="clipCount" value="3" min="1" max="10"></label>
    <button id="startBtn" disabled>✨ Generate Reels</button>
    <p class="hint">Semua proses berjalan di browser. Video 10 menit ≈ 5–10 menit proses.</p>
  </section>

  <section id="progressCard" class="card" style="display:none">
    <h2 id="progressTitle">Memproses…</h2>
    <div class="step-indicator">
      <div class="step" id="step1"></div>
      <div class="step" id="step2"></div>
      <div class="step" id="step3"></div>
      <div class="step" id="step4"></div>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <p class="hint" id="progressDetail">Menyiapkan…</p>
  </section>

  <section id="results" class="results-grid"></section>
</main>

<script type="module">
import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { toBlobURL, fetchFile } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

// 🔑 ===== TANAM API KEY DI SINI =====
const OPENAI_API_KEY = 'sk-GANTI-DENGAN-KEY-ANDA-DISINI';
// ====================================

let ffmpeg = null;
let currentVideoFile = null;

const $ = (id) => document.getElementById(id);
// ... (deklarasi DOM lainnya) ...
const videoInput = $('videoInput');
const clipCount = $('clipCount');
const startBtn = $('startBtn');
const progressCard = $('progressCard');
const progressTitle = $('progressTitle');
const progressBar = $('progressBar');
const progressDetail = $('progressDetail');
const results = $('results');
const errorBox = $('errorBox');
const successBox = $('successBox');

function showError(msg) { errorBox.textContent = '❌ ' + msg; errorBox.style.display = 'block'; setTimeout(() => { errorBox.style.display = 'none'; }, 8000); console.error(msg); }
function showSuccess(msg) { successBox.textContent = '✅ ' + msg; successBox.style.display = 'block'; setTimeout(() => { successBox.style.display = 'none'; }, 5000); }
function setStep(n, s) { const el = $('step' + n); if (el) el.className = 'step ' + s; }
function setProgress(p, t, d) { progressBar.style.width = p + '%'; if (t) progressTitle.textContent = t; if (d !== undefined) progressDetail.textContent = d; }

videoInput.addEventListener('change', (e) => {
  currentVideoFile = e.target.files[0] || null;
  startBtn.disabled = !(currentVideoFile && OPENAI_API_KEY.startsWith('sk-'));
  if (currentVideoFile) {
    const mb = (currentVideoFile.size / 1024 / 1024).toFixed(1);
    progressDetail.textContent = `${currentVideoFile.name} (${mb} MB) siap diproses`;
  }
});

// ============ PERBAIKAN FINAL: classWorkerURL DENGAN ORIGIN ABSOLUT ============
async function loadFFmpeg() {
  if (ffmpeg && ffmpeg.isLoaded()) return ffmpeg;

  ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => console.log('[ffmpeg]', message));
  ffmpeg.on('error', (err) => console.error('[ffmpeg-error]', err));

  setProgress(2, 'Memuat FFmpeg…', 'Menyiapkan mesin dari file lokal');

  const basePath = '/ffmpeg'; // Path absolut dari root situs
  const origin = window.location.origin;

  try {
    const coreURL = await toBlobURL(`${origin}${basePath}/ffmpeg-core.js`, 'text/javascript');
    const wasmURL = await toBlobURL(`${origin}${basePath}/ffmpeg-core.wasm`, 'application/wasm');
    
    // KUNCI PERBAIKAN: Gunakan location.origin + path absolut
    const classWorkerURL = `${origin}${basePath}/worker.js`;

    await ffmpeg.load({
      coreURL: coreURL,
      wasmURL: wasmURL,
      classWorkerURL: classWorkerURL,
    });
    console.log('[ffmpeg] Loaded successfully');
  } catch (err) {
    console.error('Gagal memuat FFmpeg:', err);
    throw new Error('Gagal memuat mesin FFmpeg. Periksa folder "ffmpeg" dan file di dalamnya.');
  }

  return ffmpeg;
}
// =========================================================================

// ... (Fungsi buildAss, transcribeAudio, findHighlights SAMA seperti sebelumnya) ...
const ASS_HEADER = `[Script Info]
ScriptType: v4.00+
PlayResX: 1080
PlayResY: 1920
WrapStyle: 2
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Arial,88,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,2,2,80,80,220,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
`;
function assTime(s) { if (s < 0) s = 0; const h = Math.floor(s/3600); const m = Math.floor((s%3600)/60); const sec = Math.floor(s%60); const cs = Math.round((s-Math.floor(s))*100); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; }
function escapeAss(t) { return t.replace(/\\/g,'\\\\').replace(/{/g,'\\{').replace(/}/g,'\\}').replace(/\n/g,'\\N'); }
function buildAss(words, cs, ce) {
  const inRange = words.filter(w => w.end > cs && w.start < ce);
  const chunks = [];
  for (let i = 0; i < inRange.length; i += 4) chunks.push(inRange.slice(i, i + 4));
  const events = [];
  for (const chunk of chunks) {
    const lineEnd = Math.min(chunk[chunk.length-1].end, ce);
    for (let i = 0; i < chunk.length; i++) {
      const start = Math.max(chunk[i].start, cs) - cs;
      const end = (i+1 < chunk.length ? chunk[i+1].start : lineEnd) - cs;
      if (end <= start) continue;
      const text = chunk.map((w,j) => j === i ? `{\\c&H00FFFF&}${escapeAss(w.word)}{\\c&HFFFFFF&}` : escapeAss(w.word)).join(' ');
      events.push(`Dialogue: 0,${assTime(start)},${assTime(end)},Default,,0,0,0,,{\\an2\\pos(540,1560)}${text}`);
    }
  }
  return ASS_HEADER + events.join('\n') + '\n';
}
async function transcribeAudio(apiKey, blob) {
  const fd = new FormData();
  fd.append('file', blob, 'audio.m4a');
  fd.append('model', 'whisper-1');
  fd.append('response_format', 'verbose_json');
  fd.append('timestamp_granularities[]', 'segment');
  fd.append('timestamp_granularities[]', 'word');
  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': `Bearer ${apiKey}` }, body: fd });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error('Whisper: ' + (e.error?.message || res.statusText)); }
  return res.json();
}
async function findHighlights(apiKey, segments, count) {
  const transcript = segments.map(s => `[${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s] ${s.text}`).join('\n');
  const sys = `You are an expert short-form video editor. Identify the ${count} most engaging segments for Reels/TikTok/Shorts. Each clip 20-60s, natural boundaries, no overlap. Return ONLY JSON: {"clips":[{"start":number,"end":number,"title":string,"hook":string,"caption":string}]}`;
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'gpt-4o-mini', temperature: 0.7, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: sys }, { role: 'user', content: transcript }] }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error('GPT: ' + (e.error?.message || res.statusText)); }
  const d = await res.json();
  return JSON.parse(d.choices[0].message.content).clips || [];
}

async function processVideo() {
  const apiKey = OPENAI_API_KEY;
  if (!apiKey.startsWith('sk-')) { showError('API key belum diisi di file.'); return; }
  if (!currentVideoFile) { showError('Pilih video dulu'); return; }
  const file = currentVideoFile;
  const count = Math.max(1, Math.min(10, parseInt(clipCount.value) || 3));
  if (file.size > 500 * 1024 * 1024) { showError('File >500 MB terlalu besar'); return; }
  results.innerHTML = '';
  progressCard.style.display = 'block';
  startBtn.disabled = true;
  startBtn.textContent = '⏳ Memproses…';
  try {
    setStep(1, 'active'); await loadFFmpeg(); setStep(1, 'done');
    setStep(2, 'active');
    setProgress(8, 'Menyiapkan video…', '');
    await ffmpeg.writeFile('input.mp4', await fetchFile(file));
    setProgress(15, 'Mengekstrak audio…', 'M4A 32kbps mono');
    // Tambahkan -threads 1 untuk stabilitas
    let code = await ffmpeg.exec(['-i','input.mp4','-vn','-ac','1','-ar','16000','-c:a','aac','-b:a','32k','-threads','1','-y','audio.m4a']);
    if (code !== 0) throw new Error('Ekstrak audio gagal');
    const audioData = await ffmpeg.readFile('audio.m4a');
    const audioBlob = new Blob([audioData], { type: 'audio/mp4' });
    await ffmpeg.deleteFile('audio.m4a');
    const sizeMB = audioBlob.size / 1024 / 1024;
    if (sizeMB > 24) throw new Error(`Audio ${sizeMB.toFixed(1)} MB > 25 MB (limit Whisper)`);

    setStep(2, 'done'); setStep(3, 'active');
    setProgress(25, 'Transkripsi…', `Whisper: ${sizeMB.toFixed(1)} MB`);
    const t = await transcribeAudio(apiKey, audioBlob);
    if (!t.segments?.length) throw new Error('Tidak ada suara terdeteksi');
    setProgress(45, 'Analisis momen…', `${t.segments.length} segmen ke GPT`);
    const clips = await findHighlights(apiKey, t.segments, count);
    if (!clips.length) throw new Error('Tidak ada highlight');

    setStep(3, 'done'); setStep(4, 'active');
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i];
      const pct = 50 + Math.round(((i+1)/clips.length) * 50);
      setProgress(pct - 8, `Render ${i+1}/${clips.length}…`, c.title);
      const dur = c.end - c.start;
      const ass = buildAss(t.words || [], c.start, c.end);
      await ffmpeg.writeFile('sub.ass', new TextEncoder().encode(ass));
      const base = '[0:v]split[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=30:5[blurred];[fg]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2[front];[blurred][front]overlay=(W-w)/2:(H-h)/2[withbg]';
      // Tambahkan -threads 1 pada setiap exec
      let rc = await ffmpeg.exec(['-ss', String(c.start), '-i', 'input.mp4', '-t', String(dur), '-filter_complex', base + ';[withbg]subtitles=sub.ass[vout]', '-map', '[vout]', '-map', '0:a?', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '28', '-c:a', 'aac', '-b:a', '96k', '-threads', '1', '-y', `clip${i}.mp4`]).catch(() => -1);
      if (rc !== 0) {
        rc = await ffmpeg.exec(['-ss', String(c.start), '-i', 'input.mp4', '-t', String(dur), '-filter_complex', base + ';[withbg]null[vout]', '-map', '[vout]', '-map', '0:a?', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '28', '-c:a', 'aac', '-b:a', '96k', '-threads', '1', '-y', `clip${i}.mp4`]).catch(() => -1);
      }
      await ffmpeg.deleteFile('sub.ass').catch(() => {});
      if (rc !== 0) { showError(`Render klip ${i+1} gagal`); continue; }
      const out = await ffmpeg.readFile(`clip${i}.mp4`);
      const blob = new Blob([out], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      await ffmpeg.deleteFile(`clip${i}.mp4`).catch(() => {});
      addResultCard(c, url);
      setProgress(pct, `Klip ${i+1}/${clips.length} selesai`, '');
    }
    await ffmpeg.deleteFile('input.mp4').catch(() => {});
    setStep(4, 'done');
    setProgress(100, '✅ Selesai!', `${clips.length} klip siap`);
    showSuccess(`${clips.length} klip berhasil dibuat!`);
  } catch (err) {
    console.error(err);
    showError(err.message || 'Terjadi kesalahan');
    setProgress(0, 'Gagal', err.message || '');
  } finally {
    startBtn.disabled = false;
    startBtn.textContent = '✨ Generate Reels';
  }
}

function addResultCard(clip, url) {
  const card = document.createElement('div');
  card.className = 'clip-card';
  card.innerHTML = `
    <video src="${url}" controls playsinline></video>
    <div class="clip-info">
      <h3>${escapeHtml(clip.title || 'Clip')}</h3>
      <p>🎣 ${escapeHtml(clip.hook || '')}</p>
      <p><strong>${clip.start.toFixed(1)}s – ${clip.end.toFixed(1)}s</strong> (${Math.round(clip.end - clip.start)}s)</p>
      <div class="clip-caption">${escapeHtml(clip.caption || '')}</div>
      <button class="secondary">⬇ Download MP4</button>
    </div>`;
  card.querySelector('button').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = (clip.title || 'clip').replace(/[^a-zA-Z0-9]+/g, '_') + '.mp4';
    a.click();
  });
  results.appendChild(card);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

startBtn.addEventListener('click', processVideo);
</script>
</body>
</html>
