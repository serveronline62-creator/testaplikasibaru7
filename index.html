<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teka-Teki Korek Api (Drag & Drop)</title>
    <!-- Memanggil library interact.js untuk fitur drag & drop -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            overflow: hidden;
            user-select: none; /* Mencegah teks terblok saat di-drag */
        }

        h1 { margin-bottom: 10px; text-align: center; }
        p.instruksi { color: #bdc3c7; margin-bottom: 30px; text-align: center; }

        #game-board {
            background-color: #7f8c8d;
            border-radius: 10px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            /* Tekstur meja kayu */
            background-image: repeating-linear-gradient(45deg, #7f8c8d 25%, transparent 25%, transparent 75%, #7f8c8d 75%, #7f8c8d), repeating-linear-gradient(45deg, #7f8c8d 25%, #7f8c8d 25%, #7f8c8d 75%, #7f8c8d 75%, #7f8c8d);
            background-size: 20px 20px;
        }

        .digit-container, .operator {
            position: relative;
            width: 70px;
            height: 120px;
        }

        /* Slot tempat korek api bisa diletakkan */
        .slot {
            position: absolute;
            width: 60px;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.1); /* Sedikit terlihat agar tahu letaknya */
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .slot.vertical {
            width: 10px;
            height: 60px;
        }

        /* Efek saat korek diarahkan ke slot */
        .slot.drop-target {
            background-color: rgba(46, 204, 113, 0.4);
            box-shadow: 0 0 10px #2ecc71;
        }

        /* Desain Batang Korek Api */
        .matchstick {
            position: absolute;
            background-color: #f1c40f;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            border: 1px solid #d35400;
            z-index: 10;
            /* Transisi untuk efek snap */
            transition: left 0.2s ease-out, top 0.2s ease-out; 
            touch-action: none; /* Penting untuk mobile drag */
        }
        
        .matchstick:active {
            cursor: grabbing;
        }

        .matchstick::after {
            content: '';
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
        }

        .matchstick.horizontal {
            width: 60px;
            height: 10px;
        }
        .matchstick.horizontal::after {
            width: 12px; height: 12px; right: -6px; top: -2px;
        }

        .matchstick.vertical {
            width: 10px;
            height: 60px;
        }
        .matchstick.vertical::after {
            width: 12px; height: 12px; bottom: -6px; left: -2px;
        }

        /* Saat korek sedang di-drag */
        .matchstick.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transition: none; /* Matikan transisi saat di-drag agar tidak lag */
            z-index: 100;
        }

        /* Posisi Slot pada Angka (7-Segment) */
        .pos-a { top: 0; left: 5px; }
        .pos-g { top: 55px; left: 5px; }
        .pos-d { bottom: 0; left: 5px; }
        .pos-f { top: 5px; left: 0; }
        .pos-b { top: 5px; right: 0; }
        .pos-e { bottom: 5px; left: 0; }
        .pos-c { bottom: 5px; right: 0; }

        /* Posisi untuk Operator */
        .op-pos-horizontal { top: 55px; left: 5px; }
        .op-pos-vertical { top: 5px; left: 30px; }
        .eq-pos-top { top: 35px; left: 5px; }
        .eq-pos-bottom { bottom: 35px; left: 5px; }

        #message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            text-shadow: 2px 2px 4px #000;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #reset-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>Teka-Teki Korek Api</h1>
    <p class="instruksi">Geser <b>1 batang korek api</b> agar persamaan menjadi benar!</p>

    <div id="game-board">
        <!-- Angka 1 (Awalnya 5) -->
        <div class="digit-container" id="digit-1">
            <div class="slot horizontal pos-a" data-id="d1-a"></div>
            <div class="slot vertical pos-f" data-id="d1-f"></div>
            <div class="slot horizontal pos-g" data-id="d1-g"></div>
            <div class="slot vertical pos-c" data-id="d1-c"></div>
            <div class="slot horizontal pos-d" data-id="d1-d"></div>
            <!-- Korek awal -->
            <div class="matchstick horizontal" data-slot="d1-a" style="top: 0; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="d1-f" style="top: 5px; left: 0;"></div>
            <div class="matchstick horizontal" data-slot="d1-g" style="top: 55px; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="d1-c" style="bottom: 5px; right: 0;"></div>
            <div class="matchstick horizontal" data-slot="d1-d" style="bottom: 0; left: 5px;"></div>
        </div>

        <!-- Operator 1 (Awalnya +) -->
        <div class="operator" id="op-1">
            <div class="slot horizontal op-pos-horizontal" data-id="op1-h"></div>
            <div class="slot vertical op-pos-vertical" data-id="op1-v"></div>
            <!-- Korek awal -->
            <div class="matchstick horizontal" data-slot="op1-h" style="top: 55px; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="op1-v" style="top: 5px; left: 30px;"></div>
        </div>

        <!-- Angka 2 (7) -->
        <div class="digit-container" id="digit-2">
            <div class="slot horizontal pos-a" data-id="d2-a"></div>
            <div class="slot vertical pos-b" data-id="d2-b"></div>
            <div class="slot vertical pos-c" data-id="d2-c"></div>
            <!-- Korek awal -->
            <div class="matchstick horizontal" data-slot="d2-a" style="top: 0; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="d2-b" style="top: 5px; right: 0;"></div>
            <div class="matchstick vertical" data-slot="d2-c" style="bottom: 5px; right: 0;"></div>
        </div>

        <!-- Operator 2 (=) -->
        <div class="operator" id="op-2">
            <div class="slot horizontal eq-pos-top" data-id="op2-top"></div>
            <div class="slot horizontal eq-pos-bottom" data-id="op2-bot"></div>
            <!-- Korek awal (Tanda Sama Dengan) -->
            <div class="matchstick horizontal" data-slot="op2-top" style="top: 35px; left: 5px;"></div>
            <div class="matchstick horizontal" data-slot="op2-bot" style="bottom: 35px; left: 5px;"></div>
        </div>

        <!-- Angka 3 (2) -->
        <div class="digit-container" id="digit-3">
            <div class="slot horizontal pos-a" data-id="d3-a"></div>
            <div class="slot vertical pos-b" data-id="d3-b"></div>
            <div class="slot horizontal pos-g" data-id="d3-g"></div>
            <div class="slot vertical pos-e" data-id="d3-e"></div>
            <div class="slot horizontal pos-d" data-id="d3-d"></div>
            <!-- Korek awal -->
            <div class="matchstick horizontal" data-slot="d3-a" style="top: 0; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="d3-b" style="top: 5px; right: 0;"></div>
            <div class="matchstick horizontal" data-slot="d3-g" style="top: 55px; left: 5px;"></div>
            <div class="matchstick vertical" data-slot="d3-e" style="bottom: 5px; left: 0;"></div>
            <div class="matchstick horizontal" data-slot="d3-d" style="bottom: 0; left: 5px;"></div>
        </div>
    </div>

    <div id="message">🎉 Hebat! Persamaan Benar! 🎉</div>
    <button id="reset-btn" onclick="location.reload()">Ulangi Permainan</button>

    <script>
        // Inisialisasi interaktif Drag & Drop
        interact('.matchstick').draggable({
            inertia: true,
            modifiers: [
                interact.modifiers.restrictRect({
                    restriction: '#game-board',
                    endOnly: true
                })
            ],
            autoScroll: true,
            listeners: {
                start (event) {
                    const target = event.target;
                    target.classList.add('dragging');
                    // Simpan posisi awal untuk reset jika salah taruh
                    target.dataset.originalLeft = target.style.left;
                    target.dataset.originalTop = target.style.top;
                    target.dataset.originalSlot = target.dataset.slot;
                    
                    // Lepas korek dari slot lamanya secara visual
                    target.dataset.slot = "";
                },
                move (event) {
                    const target = event.target;
                    const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                    const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

                    target.style.transform = `translate(${x}px, ${y}px)`;
                    target.setAttribute('data-x', x);
                    target.setAttribute('data-y', y);
                },
                end (event) {
                    const target = event.target;
                    target.classList.remove('dragging');
                    
                    // Cari slot terdekat tempat korek dijatuhkan
                    const closestSlot = findClosestSlot(target);
                    
                    if (closestSlot && !isSlotOccupied(closestSlot)) {
                        // Jika slot kosong, tempelkan korek ke slot
                        attachToSlot(target, closestSlot);
                    } else {
                        // Jika tidak ada slot atau slot sudah terisi, kembalikan ke posisi semula
                        target.style.transform = 'none';
                        target.setAttribute('data-x', 0);
                        target.setAttribute('data-y', 0);
                        target.dataset.slot = target.dataset.originalSlot;
                        
                        // Kembalikan ke posisi visual semula
                        const originalSlotElement = document.querySelector(`[data-id="${target.dataset.originalSlot}"]`);
                        if(originalSlotElement) {
                            target.style.left = originalSlotElement.style.left;
                            target.style.top = originalSlotElement.style.top;
                        }
                    }
                    
                    checkWin();
                }
            }
        });

        // Fungsi mencari slot terdekat dari posisi korek
        function findClosestSlot(matchstick) {
            const matchRect = matchstick.getBoundingClientRect();
            const slots = document.querySelectorAll('.slot');
            let closestSlot = null;
            let minDistance = 60; // Jarak toleransi (pixel) agar korek bisa snap

            slots.forEach(slot => {
                const slotRect = slot.getBoundingClientRect();
                const distance = Math.hypot(
                    (matchRect.left + matchRect.width / 2) - (slotRect.left + slotRect.width / 2),
                    (matchRect.top + matchRect.height / 2) - (slotRect.top + slotRect.height / 2)
                );

                if (distance < minDistance) {
                    minDistance = distance;
                    closestSlot = slot;
                }
            });
            return closestSlot;
        }

        // Cek apakah slot sudah ada koreknya
        function isSlotOccupied(slot) {
            const slotId = slot.dataset.id;
            const matched = document.querySelector(`.matchstick[data-slot="${slotId}"]`);
            return matched !== null;
        }

        // Tempelkan korek ke slot
        function attachToSlot(matchstick, slot) {
            const slotRect = slot.getBoundingClientRect();
            const boardRect = document.getElementById('game-board').getBoundingClientRect();

            // Hitung posisi absolut relatif terhadap board
            const left = slotRect.left - boardRect.left;
            const top = slotRect.top - boardRect.top;

            // Reset transform, set posisi baru
            matchstick.style.transform = 'none';
            matchstick.setAttribute('data-x', 0);
            matchstick.setAttribute('data-y', 0);
            matchstick.style.left = `${left}px`;
            matchstick.style.top = `${top}px`;
            
            // Simpan ID slot
            matchstick.dataset.slot = slot.dataset.id;
        }

        // --- LOGIKA PENGECEKAN MATEMATIKA ---

        function getSegments(digitId) {
            const sticks = document.querySelectorAll(`#${digitId} .matchstick`);
            let segments = [];
            sticks.forEach(stick => {
                const slotId = stick.dataset.slot;
                if (slotId && slotId.includes('-')) {
                    segments.push(slotId.split('-')[1]); // Mengambil huruf (a, b, c...)
                }
            });
            return segments.sort().join(','); // urutkan agar konsisten
        }

        function getNumberFromSegments(segments) {
            // Pemetaan segmen ke angka (berdasarkan susunan 7-segment)
            const mapping = {
                'a,b,c,d,e,f': 0,
                'b,c': 1,
                'a,b,d,e,g': 2,
                'a,b,c,d,g': 3,
                'b,c,f,g': 4,
                'a,c,d,f,g': 5,
                'a,c,d,e,f,g': 6,
                'a,b,c': 7,
                'a,b,c,d,e,f,g': 8,
                'a,b,c,d,f,g': 9
            };
            return mapping[segments] !== undefined ? mapping[segments] : null;
        }

        function getOperator(opId) {
            const sticks = document.querySelectorAll(`#${opId} .matchstick`);
            let hasH = false, hasV = false;
            sticks.forEach(stick => {
                if(stick.dataset.slot === `${opId}-h` || stick.dataset.slot === `${opId}-top` || stick.dataset.slot === `${opId}-bot`) hasH = true;
                if(stick.dataset.slot === `${opId}-v`) hasV = true;
            });
            if (hasH && hasV) return '+';
            if (hasH && !hasV) return '-';
            return null;
        }

        function checkWin() {
            const num1 = getNumberFromSegments(getSegments('digit-1'));
            const num2 = getNumberFromSegments(getSegments('digit-2'));
            const num3 = getNumberFromSegments(getSegments('digit-3'));
            const op1 = getOperator('op-1');

            // Pastikan semua angka valid
            if (num1 !== null && num2 !== null && num3 !== null && op1 !== null) {
                let result;
                if (op1 === '+') result = num1 + num2;
                if (op1 === '-') result = num1 - num2;

                if (result === num3) {
                    document.getElementById('message').style.opacity = 1;
                    // Nonaktifkan interaksi jika sudah menang
                    document.querySelectorAll('.matchstick').forEach(el => {
                        interact(el).draggable(false);
                    });
                } else {
                    document.getElementById('message').style.opacity = 0;
                }
            }
        }
    </script>
</body>
</html>
